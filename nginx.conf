server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Container health probe.
  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # Vite emits content-hashed filenames, so these can be cached indefinitely.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html must never be cached, or a returning visitor keeps loading the
  # previous build's asset URLs after a deploy.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # trakr is a single-page app: deep links like /details/series/80348 exist only
  # in the client-side router, so unknown paths must serve index.html instead of
  # nginx's 404. Without this, every refresh on a detail page breaks.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
